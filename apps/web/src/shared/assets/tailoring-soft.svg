
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
<defs>
<style>
.c1{fill:#0F6E8C}
.c2{fill:#0C5C73}
.c3{fill:#2F8EA6}
.c4{fill:#6FAFC1}
.stroke1{stroke:#0C5C73;stroke-width:8;stroke-linecap:round}
.stroke2{stroke:#2F8EA6;stroke-width:5;stroke-linecap:round}
</style>
</defs>

<!-- ambient shapes -->
<circle cx="220" cy="200" r="130" class="c3"/>
<circle cx="1400" cy="180" r="110" class="c4"/>
<ellipse cx="1350" cy="720" rx="220" ry="120" class="c3"/>
<ellipse cx="260" cy="740" rx="260" ry="140" class="c4"/>

<!-- dashboard frame -->
<g transform="translate(420 160)">
<rect x="0" y="0" width="760" height="520" rx="30" class="c2"/>
<rect x="0" y="0" width="760" height="80" rx="30" class="c1"/>
<rect x="0" y="80" width="160" height="440" class="c3"/>

<!-- menu dots -->
<circle cx="80" cy="140" r="12" class="c4"/>
<circle cx="80" cy="190" r="12" class="c4"/>
<circle cx="80" cy="240" r="12" class="c4"/>

<!-- workflow cards -->
<rect x="200" y="120" width="220" height="140" rx="20" class="c3"/>
<rect x="450" y="120" width="220" height="140" rx="20" class="c4"/>
<rect x="200" y="300" width="220" height="140" rx="20" class="c4"/>
<rect x="450" y="300" width="220" height="140" rx="20" class="c3"/>

<!-- garment silhouette -->
<g transform="translate(520 320)">
<circle cx="50" cy="0" r="20" class="c4"/>
<rect x="30" y="20" width="40" height="90" rx="20" class="c3"/>
<line x1="50" y1="20" x2="50" y2="110" class="stroke2"/>
<line x1="30" y1="60" x2="70" y2="60" class="stroke2"/>
</g>

<!-- fabric roll icon -->
<g transform="translate(250 160)">
<rect x="0" y="0" width="80" height="40" rx="10" class="c4"/>
<circle cx="10" cy="20" r="8" class="c2"/>
</g>

<!-- analytics line -->
<polyline points="230,380 260,350 300,370 340,330 380,350" class="stroke1" fill="none"/>

</g>

<!-- thread accent -->
<path d="M1100 480 C1220 420 1360 460 1500 380" class="stroke2" fill="none"/>
</svg>
