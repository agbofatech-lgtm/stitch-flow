<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" fill="none">
<defs>
<style>
.sea{fill:#0F6E8C}
.light{fill:#EAF5F8}
.white{fill:#FFFFFF}
.stroke{stroke:#0F6E8C;stroke-width:6;stroke-linecap:round}
</style>
</defs>

<circle cx="200" cy="160" r="90" class="light"/>
<circle cx="1050" cy="150" r="70" class="light"/>

<g transform="translate(350 250)">
<rect x="0" y="140" width="420" height="40" rx="10" class="sea"/>
<rect x="60" y="0" width="260" height="160" rx="20" class="white" stroke="#0F6E8C" stroke-width="6"/>
<rect x="250" y="40" width="100" height="80" rx="16" class="white" stroke="#0F6E8C" stroke-width="6"/>
<circle cx="80" cy="80" r="14" class="sea"/>
<line x1="80" y1="94" x2="80" y2="140" class="stroke"/>
</g>
</svg>
